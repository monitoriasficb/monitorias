<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitorías Académicas FICB</title>
    <!-- Importar fuente similar a la institucional -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --uc-verde-principal: #517135; /* Verde olivo de los títulos */
            --uc-verde-oscuro: #314221; /* Botones y textos fuertes */
            --uc-fondo-gris: #f4f5f7; /* Fondo general de la página */
            --uc-fondo-alerta: #f3f6ef; /* Fondo verde clarito de los recuadros interiores */
            --uc-texto-gris: #4a4a4a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--uc-fondo-gris);
            color: var(--uc-texto-gris);
            margin: 0;
            padding: 40px 20px;
        }

        /* Encabezado */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .logo-uc {
            max-width: 180px;
            margin-bottom: 20px;
        }

        .header h1 { 
            color: var(--uc-verde-principal); 
            font-size: 42px;
            font-weight: 800;
            margin: 0 0 10px 0;
        }
        
        .header p {
            font-size: 18px;
            color: #555;
            margin: 0;
        }
        
        /* Contenedor de Filtros */
        .filtros-container {
            max-width: 900px;
            margin: 0 auto 40px auto;
            display: flex;
            gap: 20px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            flex-wrap: wrap;
        }
        
        .filtro-grupo {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
        }
        
        .filtro-grupo label {
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--uc-verde-principal);
            font-size: 15px;
        }
        
        .filtro-grupo select {
            padding: 12px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            color: #333;
            background-color: #fafafa;
        }

        .filtro-grupo select:focus {
            border-color: var(--uc-verde-principal);
        }
        
        /* Grid y Tarjetas (Inspiradas en los pasos de la imagen) */
        .grid-monitorias {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            max-width: 1100px;
            margin: 0 auto;
        }
        
        .tarjeta {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border-top: 5px solid var(--uc-verde-principal);
        }
        
        .tarjeta h3 { 
            margin: 0 0 15px 0; 
            color: var(--uc-verde-oscuro); 
            font-size: 22px;
            font-weight: 700;
        }
        
        /* El recuadro interior que pediste */
        .datos-resaltados {
            background-color: var(--uc-fondo-alerta);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
        }

        .datos-resaltados p { 
            margin: 8px 0; 
            font-size: 15px; 
            line-height: 1.5;
        }

        .etiqueta-modalidad {
            display: inline-block;
            font-weight: 700;
            color: var(--uc-verde-principal);
            margin-bottom: 10px;
        }

        /* Formulario y Botón */
        .reserva-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .reserva-form p {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--uc-texto-gris);
        }

        .reserva-form input { 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 14px;
        }
        
        .btn-reservar {
            background-color: var(--uc-verde-oscuro);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: background-color 0.2s;
        }
        
        .btn-reservar:hover { 
            background-color: #1e2914; 
        }
        
        .btn-reservar:disabled { 
            background-color: #a0a0a0; 
            cursor: not-allowed; 
        }
        
        .mensaje-carga { 
            text-align: center; 
            font-size: 18px; 
            color: #666; 
            margin-top: 40px;
        }
        /* Animación de estado de carga */
        .contenedor-carga {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 5px solid rgba(0, 0, 0, 0.08);
            border-left-color: var(--uc-verde-principal);
            border-radius: 50%;
            animation: girar 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes girar {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Oculta los filtros inicialmente */
        #seccionFiltros {
            display: none; 
        }
    </style>
</head>
<body>

    <div class="header">
        <!-- Reemplaza el src con la URL del logo de la UC que usas en tu otro repositorio -->
        <img src="https://www.ucentral.edu.co/sites/default/files/logo_1.png" alt="Universidad Central" class="logo-uc" onerror="this.style.display='none'">
        <h1>Monitorías Académicas FICB</h1>
        <p>Agenda tu espacio de apoyo</p>
    </div>

    <!-- Se le agregó el ID seccionFiltros para mantenerlo oculto al inicio -->
    <div class="filtros-container" id="seccionFiltros">
        <div class="filtro-grupo">
            <label for="filtroAsignatura">Selecciona tu Asignatura:</label>
            <select id="filtroAsignatura" onchange="filtrarTarjetas()">
                <option value="">-- Todas las asignaturas --</option>
            </select>
        </div>
        <div class="filtro-grupo">
            <label for="filtroMonitor">Selecciona al Monitor:</label>
            <select id="filtroMonitor" onchange="filtrarTarjetas()">
                <option value="">-- Todos los monitores --</option>
            </select>
        </div>
    </div>

    <!-- Nuevo diseño del estado de carga -->
    <div id="estadoCarga" class="contenedor-carga">
        <div class="spinner"></div>
        <div style="font-size: 18px; color: #666; font-weight: 600;">Conectando con la base de datos...</div>
    </div>
    
    <div class="grid-monitorias" id="contenedorTarjetas"></div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbynChPc4WrM_sOuHfG9cjI6pwvxc_KLWEZx3aCqm9Ons7MsynmON4_lZjL8N87ltTwt6Q/exec"; 
        let datosGlobales = []; 

        async function cargarDatos() {
            try {
                const respuesta = await fetch(WEB_APP_URL);
                const datos = await respuesta.json();
                
                if(datos.error) throw new Error(datos.error);
                
                datosGlobales = datos;
                
                // Ocultamos el spinner animado
                document.getElementById('estadoCarga').style.display = 'none';
                
                // Hacemos aparecer los filtros de golpe ya listos para usar
                document.getElementById('seccionFiltros').style.display = 'flex';
                
                poblarFiltros(datosGlobales); 
                
                document.getElementById('contenedorTarjetas').innerHTML = "<p style='grid-column: 1 / -1; text-align: center; font-size: 18px; color: #555;'>👈 Por favor selecciona una asignatura o monitor para ver los horarios disponibles.</p>";
                
            } catch (error) {
                document.getElementById('estadoCarga').innerHTML = "<div style='color: #d32f2f; font-weight: bold;'>Error al cargar los datos. Verifica tu conexión.</div>";
                console.error("Detalle del error:", error);
            }
        }
        
        // Esta es la función que se había borrado por accidente
        function poblarFiltros(datos) {
            const selectAsignatura = document.getElementById('filtroAsignatura');
            const selectMonitor = document.getElementById('filtroMonitor');
            
            selectAsignatura.innerHTML = '<option value="">-- Todas las asignaturas --</option>';
            selectMonitor.innerHTML = '<option value="">-- Todos los monitores --</option>';
            
            const asignaturasUnicas = [...new Set(datos.map(d => d.asignatura))].sort();
            const monitoresUnicos = [...new Set(datos.map(d => d.monitor))].sort();
            
            asignaturasUnicas.forEach(asig => {
                selectAsignatura.innerHTML += `<option value="${asig}">${asig}</option>`;
            });
            
            monitoresUnicos.forEach(mon => {
                selectMonitor.innerHTML += `<option value="${mon}">${mon}</option>`;
            });
        }

        function filtrarTarjetas() {
            const asigSeleccionada = document.getElementById('filtroAsignatura').value;
            const monSeleccionado = document.getElementById('filtroMonitor').value;
            
            // Si ambos filtros están vacíos, ocultamos todo para ahorrar memoria
            if (asigSeleccionada === "" && monSeleccionado === "") {
                document.getElementById('contenedorTarjetas').innerHTML = "<p style='grid-column: 1 / -1; text-align: center; font-size: 18px; color: #555;'>👈 Por favor selecciona una asignatura o monitor para ver los horarios disponibles.</p>";
                return;
            }
            
            // Filtramos y mostramos solo lo que el estudiante busca
            const resultadosFiltrados = datosGlobales.filter(mon => {
                const coincideAsig = asigSeleccionada === "" || mon.asignatura === asigSeleccionada;
                const coincideMon = monSeleccionado === "" || mon.monitor === monSeleccionado;
                return coincideAsig && coincideMon; 
            });
            
            renderizarTarjetas(resultadosFiltrados);
        }

        function renderizarTarjetas(listaMonitorias) {
            const contenedor = document.getElementById('contenedorTarjetas');
            contenedor.innerHTML = ""; 

            if (listaMonitorias.length === 0) {
                contenedor.innerHTML = "<p style='grid-column: 1 / -1; text-align: center; font-size: 18px;'>No hay monitorías disponibles con estos filtros o fechas.</p>";
                return;
            }

            listaMonitorias.forEach(mon => {
                const tarjetaHTML = `
                    <div class="tarjeta">
                        <h3>${mon.asignatura}</h3>
                        
                        <div class="datos-resaltados">
                            <span class="etiqueta-modalidad">• Modalidad ${mon.modalidad}</span>
                            <p><strong>Monitor:</strong> ${mon.monitor}</p>
                            <p><strong>Fecha:</strong> ${mon.fecha}</p>
                            <p><strong>Horario:</strong> ${mon.horaInicio} - ${mon.horaFin}</p>
                            <p style="color: var(--uc-verde-principal);"><strong>Cupos disponibles:</strong> ${mon.cupos}</p>
                        </div>

                        <div class="reserva-form">
                            <p>¿Interesado en agendar?</p>
                            <input type="text" id="nombre_${mon.idBloque}" placeholder="Tu nombre completo" required style="margin-bottom: 5px;">
                            <input type="email" id="email_${mon.idBloque}" placeholder="Tu correo institucional" required>
                            <button class="btn-reservar" onclick="reservar('${mon.idBloque}')">Confirmar Reserva</button>
                        </div>
                    </div>
                `;
                contenedor.innerHTML += tarjetaHTML;
            });
        }

        async function reservar(idBloque) {
            const nombreInput = document.getElementById(`nombre_${idBloque}`);
            const emailInput = document.getElementById(`email_${idBloque}`);
            
            const nombre = nombreInput.value.trim();
            const email = emailInput.value.trim();

            if (!nombre) {
                alert("Por favor, ingresa tu nombre completo.");
                return;
            }

            if (!email || !email.includes('@')) {
                alert("Por favor, ingresa un correo válido.");
                return;
            }

            const btn = emailInput.nextElementSibling;
            btn.innerText = "Procesando...";
            btn.disabled = true;

            const payload = { idBloque: idBloque, nombreEstudiante: nombre, emailEstudiante: email };

            try {
                const respuesta = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const resultado = await respuesta.json();
                
                if (resultado.status === "exito") {
                    alert("¡Monitoría reservada con éxito! Revisa tu bandeja de entrada para ver los detalles.");
                    
                    // Limpiamos los campos de texto
                    nombreInput.value = "";
                    emailInput.value = "";
                    
                    cargarDatos(); 
                } else {
                    alert("Hubo un problema: " + resultado.error);
                    btn.innerText = "Confirmar Reserva";
                    btn.disabled = false;
                }
            } catch (error) {
                alert("Error de conexión al servidor. Intenta de nuevo.");
                btn.innerText = "Confirmar Reserva";
                btn.disabled = false;
            }
        }

        cargarDatos();
    </script>
</body>
</html>
